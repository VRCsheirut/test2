<head>

    <style>
        html {
            scroll-behavior: smooth;
        }

        section#cast {
            max-width: 1200px;
            margin: 2.5rem auto;
            background: var(--white-soft, #ffffff);
            border-radius: 20px;
            padding: 2.5rem 1.5rem;
            box-shadow: 0 10px 30px rgba(232, 165, 184, 0.15);
            border: 1.5px solid #f3dbe0;
            position: relative;
        }

        .cast-group-title {
            font-size: 1.3rem;
            color: var(--deep-pink, #c97389);
            border-bottom: 2px solid var(--main-pink, #f8dbdb);
            padding-bottom: 0.4rem;
            margin: 2rem 0 1.5rem;
            text-align: center;
        }

        .cast-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
        }

        .cast-card {
            background: #fff8f9;
            border-radius: 16px;
            border: 1.5px solid #f3dbe0;
            padding: 1.5rem 0.8rem;
            text-align: center;
            box-shadow: 0 4px 12px rgba(232, 165, 184, 0.08);
        }

        .cast-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: var(--main-pink, #f8dbdb);
            margin: 0 auto 0.8rem;
            border: 3px solid #fff;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }

        .cast-avatar:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 16px rgba(232, 165, 184, 0.45);
        }

        .cast-name {
            font-weight: bold;
            color: var(--text-dark, #5a4a4a);
            font-size: 0.95rem;
        }

        .coming-soon-box {
            text-align: center;
            padding: 2.5rem 1rem;
            background: #fff8f9;
            border-radius: 16px;
            border: 2px dashed var(--accent-pink, #e8a5b8);
            color: var(--deep-pink, #c97389);
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            position: relative;
            background: #ffffff;
            padding: 2rem 1.2rem 1.5rem 1.2rem;
            border-radius: 20px;
            max-width: 1200px;
            width: 95%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            border: 3px solid var(--accent-pink, #e8a5b8);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .modal-large-img {
            max-width: 100%;
            max-height: 60vh;
            width: auto;
            height: auto;
            border-radius: 12px;
            border: 2px solid var(--main-pink, #f8dbdb);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            object-fit: contain;
            margin-bottom: 1.2rem;
            background-color: #ffffff;
        }

        .profile-x-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background-color: #fff;
            color: var(--deep-pink, #c97389);
            border: 1.5px solid var(--accent-pink, #e8a5b8);
            padding: 0.6rem 1.8rem;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(232, 165, 184, 0.2);
        }

        .profile-x-btn:hover {
            background-color: var(--deep-pink, #c97389);
            color: #fff;
            border-color: var(--deep-pink, #c97389);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--deep-pink, #c97389);
            color: #fff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .close-btn:hover {
            transform: scale(1.1);
        }

        @media (max-width: 992px) {
            .cast-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .cast-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('fade-in');

            const links = document.querySelectorAll('a');
            links.forEach(link => {
                link.addEventListener('click', (e) => {
                    const href = link.getAttribute('href');
                    const isAnchor = href && (href.startsWith('#') || href.includes('index.html#'));
                    
                    if (href && !isAnchor && !href.startsWith('http') && href !== '' && href !== '#') {
                        e.preventDefault();
                        document.body.classList.remove('fade-in');
                        document.body.classList.add('fade-out');
                        setTimeout(() => {
                            window.location.href = href;
                        }, 400);
                    }
                });
            });

            const menuToggle = document.getElementById('menu-toggle');
            const headerToolbar = document.getElementById('header-toolbar');

            menuToggle.addEventListener('click', () => {
                headerToolbar.classList.toggle('is-open');
            });

            const bgmScript = document.createElement('script');
            bgmScript.src = 'bgm.js';
            document.body.appendChild(bgmScript);

            const modal = document.getElementById('image-modal');
            const modalTapImg = document.getElementById('modal-tap-img');
            const modalXLink = document.getElementById('modal-x-link');
            const modalClose = document.getElementById('modal-close');
            const avatars = document.querySelectorAll('.cast-avatar');

            avatars.forEach(avatar => {
                avatar.addEventListener('click', () => {
                    const tapImg = avatar.getAttribute('data-tap');
                    const xUrl = avatar.getAttribute('data-x');
                    
                    modalTapImg.src = tapImg || '';
                    modalXLink.href = xUrl || '#';

                    modal.style.display = 'flex';
                    modal.setAttribute('aria-hidden', 'false');
                });
            });

            const closeModal = () => {
                modal.style.display = 'none';
                modal.setAttribute('aria-hidden', 'true');
            };

            modalClose.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal.style.display === 'flex') closeModal();
            });
        });
    </script>
