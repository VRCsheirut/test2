            -webkit-overflow-scrolling: touch;

        .calendar-controls {
            display: flex;
            justify-content: center;
            align-items: center;

        .calendar-btn {
            background: var(--main-pink, #f8dbdb);
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            color: var(--text-dark, #5a4a4a);
            font-weight: bold;
            font-size: 0.85rem;
            transition: background 0.2s;

        .calendar-btn:hover {
            background: var(--accent-pink, #e8a5b8);
            color: #fff;
        }

        .calendar-title-display {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--deep-pink, #c97389);
            min-width: 140px;
            text-align: center;
        }

        .calendar-table {
            width: 100%;
            min-width: 320px;
            max-width: 850px;
            margin: 0 auto;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.95rem;
        }

        .calendar-table th, .calendar-table td {
            border: 1.5px solid var(--main-pink, #f8dbdb);
            padding: 0.5rem 0.2rem;
            height: 55px;
            vertical-align: middle;
        }

        .calendar-table th {
            background-color: #fff0f3;
            color: var(--deep-pink, #c97389);
            font-size: 0.95rem;
        }

            <div class="calendar-controls">

    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('fade-in');

            const links = document.querySelectorAll('a');
            links.forEach(link => {
                link.addEventListener('click', (e) => {
                    const href = link.getAttribute('href');
                    const isAnchor = href && (href.startsWith('#') || href.includes('index.html#'));
                    
                    if (href && !isAnchor && !href.startsWith('http') && href !== '' && href !== '#') {
                        e.preventDefault();
                        document.body.classList.remove('fade-in');
                        document.body.classList.add('fade-out');
                        setTimeout(() => {
                            window.location.href = href;
                        }, 400);
                    }
                });
            });

            const menuToggle = document.getElementById('menu-toggle');
            const headerToolbar = document.getElementById('header-toolbar');

            menuToggle.addEventListener('click', () => {
                headerToolbar.classList.toggle('is-open');
            });

            const bgmScript = document.createElement('script');
            bgmScript.src = 'bgm.js';
            document.body.appendChild(bgmScript);

            const calendarBody = document.getElementById('calendar-body');
            const currentMonthDisplay = document.getElementById('current-month-display');
            const prevBtn = document.getElementById('prev-month');
            const nextBtn = document.getElementById('next-month');

            let currentDate = new Date(2026, 8, 1);
            const baseDate = new Date(2026, 8, 8);
            baseDate.setHours(0, 0, 0, 0);

            function isBiweeklyTuesday(targetDate) {
                targetDate.setHours(0, 0, 0, 0);
                const diffTime = targetDate.getTime() - baseDate.getTime();
                const diffDays = Math.round(diffTime / (1000 * 3600 * 24));
                return diffDays >= 0 && diffDays % 14 === 0;
            }

            function renderCalendar(date) {
                const year = date.getFullYear();
                const month = date.getMonth();

                currentMonthDisplay.textContent = `${year}年 ${month + 1}月`;
                calendarBody.innerHTML = '';

                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();

                let dateCount = 1;
                let html = '';

                for (let i = 0; i < 6; i++) {
                    let row = '<tr>';
                    let hasDate = false;

                    for (let j = 0; j < 7; j++) {
                        if ((i === 0 && j < firstDay) || dateCount > daysInMonth) {
                            row += '<td></td>';
                        } else {
                            hasDate = true;

                            let colorStyle = '';
                            if (j === 0) colorStyle = 'color: #e8a5b8;';
                            if (j === 6) colorStyle = 'color: #9bb7d4;';

                            const thisDate = new Date(year, month, dateCount);
                            const showTulip = isBiweeklyTuesday(thisDate);
                            const tulipMark = showTulip 
                                ? '<div style="font-size: 0.9em; margin-top: 2px;">🌷</div>' 
                                : '';

                            row += `
                                <td style="${colorStyle} vertical-align: top; padding: 6px 2px;">
                                    <strong>${dateCount}</strong>
                                    ${tulipMark}
                                </td>`;
                            
                            dateCount++;
                        }
                    }
                    row += '</tr>';
                    if (hasDate) html += row;
                }
                calendarBody.innerHTML = html;
            }

            prevBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar(currentDate);
            });

            nextBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar(currentDate);
            });

            renderCalendar(currentDate);
        });
    </script>
</body>
