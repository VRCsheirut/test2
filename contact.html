<!DOCTYPE html>
<html lang="ja">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        html {
            scroll-behavior: smooth;
        }

        section#contact {
            max-width: 800px;
            margin: 2.5rem auto;
            background: var(--white-soft, #ffffff);
            border-radius: 20px;
            padding: 3rem 2rem;
            box-shadow: 0 10px 30px rgba(232, 165, 184, 0.15);
            border: 1.5px solid #f3dbe0;
            position: relative;
            text-align: center;
        }

        .contact-text {
            font-size: 1rem;
            line-height: 2.2;
            color: var(--text-dark, #5a4a4a);
            margin-bottom: 2.5rem;
        }

        .contact-btn-wrapper {
            margin-top: 1.5rem;
        }

        .x-contact-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background-color: #ffffff;
            color: var(--deep-pink, #c97389);
            border: 1.5px solid var(--accent-pink, #e8a5b8);
            padding: 0.9rem 2.5rem;
            border-radius: 30px;
            font-size: 1.05rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(232, 165, 184, 0.2);
        }

        .x-contact-btn:hover {
            background-color: var(--deep-pink, #c97389);
            color: #ffffff;
            border-color: var(--deep-pink, #c97389);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            section#contact {
                padding: 2rem 1.2rem;
            }
            .contact-text {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <span class="site-title-text">Fyulap</span>
        </div>

        <button class="menu-toggle" id="menu-toggle" aria-label="メニューを開く">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="header-toolbar" id="header-toolbar">
            <ul>
                <li><a href="index.html">top</a></li>
                <li><a href="index.html#news">news</a></li>
                <li><a href="howtojoin.html">how to join</a></li>
                <li><a href="maid.html">maid</a></li>
                <li><a href="schedule.html">schedule</a></li>
                <li><a href="attention.html">attention</a></li>
                <li><a href="contact.html">お問い合わせ</a></li>
                <li><a href="https://x.com/fyulap" target="_blank" rel="noopener noreferrer" class="sns-btn-circle" title="official X"><img src="images/x.png" alt="X" class="sns-icon-img"></a></li>
                <li><a href="https://vrchat.com/home/group/grp_969b10f2-5420-49b3-8d13-1778eb145fb4" target="_blank" rel="noopener noreferrer" class="sns-btn-circle" title="VRC Group"><img src="images/vrc.png" alt="VRC" class="sns-icon-img"></a></li>
            </ul>
        </nav>
    </header>

    <audio id="bgm-audio" loop preload="metadata">
        <source src="audio/0102.mp3" type="audio/mpeg">
    </audio>

    <div class="bgm-fixed-widget">
        <button id="mute-btn" class="mute-btn" title="ミュート切替" aria-label="ミュート切替">
            <svg id="icon-volume" viewBox="0 0 24 24">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <svg id="icon-mute" viewBox="0 0 24 24" style="display: none;">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
        </button>
        <div class="slider-container">
            <div id="slider-progress" class="slider-progress"></div>
            <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="0.5" aria-label="音量調整">
        </div>
    </div>

    <div class="container">
        <section id="contact">
            <div class="section-title">
                <h2>Contact</h2>
                <span>お問い合わせ</span>
            </div>
            
            <p class="contact-text">
                お問い合わせは、現在公式Xから受け付けています。<br>
                どんな些細なことでもお答えいたします、イベントの質問　コラボ依頼等常時受け付け中<br>
                 順次運営がお返事させていただきます。少しお時間をいただく場合があります。
            </p>

            <div class="contact-btn-wrapper">
                <a href="https://x.com/fyulap" target="_blank" rel="noopener noreferrer" class="x-contact-btn">
                    Xにて問い合わせる ↗
                </a>
            </div>
        </section>
    </div>

    <footer>
        <div class="footer-sns-links">
            <a href="https://x.com/fyulap" target="_blank" rel="noopener noreferrer" class="sns-btn-circle" title="official X"><img src="images/x.png" alt="X" class="sns-icon-img"></a>
            <a href="https://vrchat.com/home/group/grp_969b10f2-5420-49b3-8d13-1778eb145fb4" target="_blank" rel="noopener noreferrer" class="sns-btn-circle" title="VRC Group"><img src="images/vrc.png" alt="VRC" class="sns-icon-img"></a>
        </div>
        <p>© Fyulap All Rights Reserved. しぇいる / Photo by 藍香</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('fade-in');

            const links = document.querySelectorAll('a');
            links.forEach(link => {
                link.addEventListener('click', (e) => {
                    const href = link.getAttribute('href');
                    const isAnchor = href && (href.startsWith('#') || href.includes('index.html#'));
                    
                    if (href && !isAnchor && !href.startsWith('http') && href !== '' && href !== '#') {
                        e.preventDefault();
                        document.body.classList.remove('fade-in');
                        document.body.classList.add('fade-out');
                        setTimeout(() => {
                            window.location.href = href;
                        }, 400);
                    }
                });
            });

            const menuToggle = document.getElementById('menu-toggle');
            const headerToolbar = document.getElementById('header-toolbar');

            menuToggle.addEventListener('click', () => {
                headerToolbar.classList.toggle('is-open');
            });

            const bgmScript = document.createElement('script');
            bgmScript.src = 'bgm.js';
            document.body.appendChild(bgmScript);
        });
    </script>
</body>
</html>
